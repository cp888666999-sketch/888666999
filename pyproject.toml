[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qslab"
version = "0.1.0"
description = "Quant indicators and a polite HTTP client for research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "cp888666999-sketch" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
spider = ["beautifulsoup4>=4.12", "lxml>=5.0"]

[project.scripts]
qslab = "qslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
